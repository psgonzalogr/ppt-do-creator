<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NOMBRE}}</title>
<style>
{{fonts}}
:root{
  --navy:#0B2D4F; --navy2:#123E6B; --blue:#2462AC; --ocean:#0E7AC2; --teal:#0E6E92;
  --cyan:#00A9E6; --aqua:#33B6C2; --ink:#1E2B38; --muted:#5A6B7C; --bg:#F3F7FA;
  --line:#D5E2EC; --card:#FFFFFF; --soft:#E6F1F8; --amber:#F2A33A;
  --ease:cubic-bezier(.2,.75,.2,1);
  --darkbg:radial-gradient(1200px 900px at 85% 30%,#174d80 0%,#0B2D4F 55%,#071f38 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B2D4F;overflow:hidden}
body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0}
#deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden}
#bg{position:absolute;inset:0;background:var(--bg)}
#bgdark{position:absolute;inset:0;background:var(--darkbg);opacity:0;transition:opacity 1s var(--ease)}
#deck.is-dark #bgdark{opacity:1}

/* moving brand orbs (persist between slides) */
#orbs{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;left:0;top:0;width:100px;height:100px;transition:transform 1.25s var(--ease),opacity 1.25s var(--ease)}
.orb i{display:block;width:100%;height:100%;border-radius:50%;background:currentColor;animation:orbbob 9s ease-in-out infinite}
.orb:nth-child(2n) i{animation-duration:11s;animation-delay:-3s}
.orb:nth-child(3n) i{animation-duration:13s;animation-delay:-6s}
@keyframes orbbob{0%,100%{transform:translate(0,0)}33%{transform:translate(8%,-10%)}66%{transform:translate(-6%,7%)}}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;
  transition:opacity .45s ease .3s,visibility 0s linear .8s}
.slide.active{opacity:1;visibility:visible;transition:opacity .45s ease .05s,visibility 0s}
.slide.leaving{visibility:visible}
.dark{color:#fff}
.pad{position:absolute;inset:92px 120px 150px 120px}

.deco{position:absolute;pointer-events:none}
.ring{overflow:visible}
.spin{animation:spin 90s linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.grid-dots{position:absolute;width:260px;height:180px;background-image:radial-gradient(circle,rgba(14,122,194,.22) 2.5px,transparent 3px);background-size:26px 26px;animation:dotsdrift 14s linear infinite}
.dark .grid-dots{background-image:radial-gradient(circle,rgba(255,255,255,.18) 2.5px,transparent 3px)}
@keyframes dotsdrift{to{background-position:26px 26px}}

/* typography */
.eyebrow{font-family:Montserrat,sans-serif;font-weight:700;font-size:21px;letter-spacing:.22em;text-transform:uppercase;color:var(--ocean);display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:46px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--cyan));background-size:200% 100%;animation:shim 3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.dark .eyebrow{color:#7fd3f5}
h1,h2,h3{font-family:Montserrat,sans-serif;color:var(--navy);letter-spacing:-.015em}
.dark h1,.dark h2,.dark h3{color:#fff}
h2{font-size:64px;font-weight:800;line-height:1.06;margin-top:18px}
h2 em{font-style:normal;background:linear-gradient(90deg,var(--ocean),var(--aqua),var(--ocean));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.dark h2 em{background-image:linear-gradient(90deg,#5fd0ff,#7fe3e0,#5fd0ff)}
h3{font-size:32px;font-weight:700;line-height:1.15}
p{font-size:30px;line-height:1.45;color:#2a3a4a;text-align:justify;text-align-last:left;hyphens:manual;-webkit-hyphens:manual}
.dark p{color:#d7e6f3}
strong{color:var(--navy);font-weight:700}
.dark strong{color:#fff}
.num{font-family:Montserrat,sans-serif;font-weight:800;color:var(--ocean)}
.ico{width:1em;height:1em;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;display:block}
svg.lucide{width:1em;height:1em;display:block;overflow:visible}

/* ambient icon motion */
.slide.active svg.lucide{transform-box:fill-box;transform-origin:center;animation:ibob 3.4s ease-in-out infinite}
.slide.active .card:nth-child(2n) svg.lucide,.slide.active .chip:nth-child(2n) svg.lucide{animation-delay:-1.2s}
.slide.active .card:nth-child(3n) svg.lucide,.slide.active .chip:nth-child(3n) svg.lucide{animation-delay:-2.3s}
.slide.active svg.lucide-refresh-ccw{animation:ispin 4s linear infinite}
.slide.active svg.lucide-megaphone,.slide.active svg.lucide-party-popper,.slide.active svg.lucide-timer,.slide.active svg.lucide-users{animation:iwig 2.6s ease-in-out infinite}
.slide.active svg.lucide-calendar-clock,.slide.active svg.lucide-message-circle,.slide.active svg.lucide-messages-square,.slide.active svg.lucide-pencil{animation:iwig 3.6s ease-in-out infinite}
.slide.active svg.lucide-heart-pulse,.slide.active svg.lucide-heart-handshake,.slide.active svg.lucide-check,.slide.active svg.lucide-shield-check,.slide.active svg.lucide-target{animation:ibeat 1.9s ease-in-out infinite}
.slide.active svg.lucide-lightbulb,.slide.active svg.lucide-sparkles,.slide.active svg.lucide-star,.slide.active svg.lucide-crown,.slide.active svg.lucide-award{animation:iglow 2.4s ease-in-out infinite}
.slide.active svg.lucide-map-pin,.slide.active svg.lucide-arrow-right,.slide.active svg.lucide-zoom-in{animation:ibounce 1.6s ease-in-out infinite}
.slide.active svg.lucide-eye-off{animation:iblink 3s ease-in-out infinite}
.slide.active svg.lucide-fast-forward{animation:ifwd 1.4s ease-in-out infinite}
@keyframes ibob{50%{transform:translateY(-12%)}}
@keyframes ispin{to{transform:rotate(-360deg)}}
@keyframes iwig{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(12deg)}30%{transform:rotate(-8deg)}40%{transform:rotate(5deg)}}
@keyframes ibeat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.12)}}
@keyframes iglow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,214,90,0))}50%{transform:scale(1.1);filter:drop-shadow(0 0 6px rgba(255,214,90,.9))}}
@keyframes ibounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}60%{transform:translateY(4%)}}
@keyframes iblink{0%,45%,55%,100%{opacity:1}50%{opacity:.25}}
@keyframes ifwd{0%{transform:translateX(-12%)}50%{transform:translateX(14%)}100%{transform:translateX(-12%)}}

/* footer chrome */
.foot{position:absolute;left:120px;right:40px;bottom:26px;height:104px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;z-index:5}
.foot .meta{display:flex;align-items:center;gap:18px;font-family:Montserrat,sans-serif;font-size:17px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding-bottom:10px;transition:color .8s}
.foot .pg{font-weight:800;color:#fff;background:var(--navy);border-radius:999px;padding:6px 14px;font-size:16px;letter-spacing:.06em;transition:background .8s,color .8s;min-width:88px;text-align:center}
#deck.is-dark .foot .meta,.dark .foot .meta{color:#a9c6df}
#deck.is-dark .foot .pg,.dark .foot .pg{background:var(--cyan);color:var(--navy)}
.logos{display:flex;align-items:center;gap:18px;background:#fff;border-radius:22px;padding:10px 22px;box-shadow:0 10px 30px rgba(11,45,79,.14);border:1px solid rgba(11,45,79,.06)}
.logos img{height:84px;width:auto;display:block}
.logos .sep{width:1px;height:66px;background:var(--line)}

/* entrance / exit */
.slide .a{opacity:0}
.slide.active .a{animation:var(--an,up) .85s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms + 360ms)}
.slide.leaving .a{animation:out .5s var(--ease) both!important;animation-delay:calc(var(--i,0) * 15ms)!important}
.slide.leaving.back .a{--ox:70px}
@keyframes out{from{opacity:1;transform:none}to{opacity:0;transform:translateX(var(--ox,-70px))}}
@keyframes up{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes growx{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes tiltin{from{opacity:0;transform:translateX(120px) rotate(6deg)}to{opacity:1}}
.u{--an:up}.l{--an:left}.r{--an:right}.p{--an:pop}.f{--an:fade}.d{--an:down}.g{--an:grow;transform-origin:bottom}.gx{--an:growx;transform-origin:left}
.draw path,.draw line{stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .draw path,.slide.active .draw line{animation:draw 1.1s var(--ease) forwards;animation-delay:calc(var(--i,0) * 90ms + 450ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.slide.leaving .draw path,.slide.leaving .draw line{stroke-dashoffset:0}
.slide.leaving .flowdots,.slide.leaving .beam,.slide.leaving .msg{opacity:0!important;transition:opacity .2s}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.flowline{stroke-dasharray:.006 .02;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-.052}}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(0,169,230,.45)}100%{box-shadow:0 0 0 22px rgba(0,169,230,0)}}

/* generic cards */
.card{background:var(--card);border-radius:28px;box-shadow:0 14px 40px rgba(11,45,79,.09);border:1px solid rgba(11,45,79,.05)}
.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:var(--soft);color:var(--navy);font-family:Montserrat,sans-serif;font-weight:700;font-size:24px}
.iconbox{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:38px;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 10px 24px rgba(36,98,172,.28);flex:none}

/* ---------- Portada ---------- */
.s1 .pad{display:flex;flex-direction:column;justify-content:center}
.s1 h1{font-size:150px;font-weight:900;line-height:.95;letter-spacing:-.03em;margin:28px 0 36px}
.s1 h1 span{display:block}
.s1 h1 .amp{font-weight:300;font-style:italic;color:#7fd3f5;font-size:120px}
.s1 .sub{font-family:Montserrat,sans-serif;font-size:32px;font-weight:600;color:#cfe6f7;line-height:1.35}
.s1 .sub b{color:#fff;font-weight:800}
.s1 .bar{width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--aqua),var(--cyan));background-size:200% 100%;margin-bottom:34px;transform-origin:left}
.slide.active .s1bar{animation:growx .85s var(--ease) both .8s,shim 3s linear infinite 1.6s}

/* ---------- Objetivo ---------- */
.obj .wrap{display:grid;grid-template-columns:.95fr 1.05fr;gap:80px;height:100%}
.obj .gen{position:relative;margin-top:40px;padding:48px 50px 46px;border-radius:34px;background:linear-gradient(145deg,var(--navy),var(--blue));box-shadow:0 30px 60px rgba(11,45,79,.25)}
.obj .gen b{display:block;font-family:Montserrat;font-weight:800;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#7fd3f5;margin-bottom:16px}
.obj .gen p{color:#fff;font-size:29px;line-height:1.45;padding-right:40px}
.obj .target{position:absolute;right:-56px;bottom:-96px;width:220px;height:220px;overflow:visible}
.obj .target .rp{transform-box:view-box;transform-origin:110px 110px;animation:tring 2.4s ease-out infinite}
.obj .target .rp:nth-of-type(2){animation-delay:.8s}.obj .target .rp:nth-of-type(3){animation-delay:1.6s}
@keyframes tring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.obj-arrow{transform-box:view-box;transform-origin:110px 110px}
.slide.active .obj-arrow{animation:arrowin .7s cubic-bezier(.3,1.6,.5,1) both 1.1s,arrowwob 3s ease-in-out infinite 1.8s}
@keyframes arrowin{from{transform:translate(160px,-160px);opacity:0}to{transform:none;opacity:1}}
@keyframes arrowwob{0%,100%{transform:rotate(0)}5%{transform:rotate(-3deg)}10%{transform:rotate(2deg)}15%{transform:rotate(0)}}
.obj .lead{font-family:Montserrat;font-weight:700;font-size:28px;color:var(--navy);line-height:1.3;margin-bottom:8px}
.obj .list{display:flex;flex-direction:column;gap:20px;justify-content:center;height:100%}
.obj .it{display:flex;gap:26px;align-items:center;padding:24px 30px}
.obj .it p{font-size:27px;line-height:1.35;color:var(--ink)}

/* ---------- Intro ---------- */
.s2 .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:90px;height:100%;align-items:center}
.s2 .lead{font-size:34px;line-height:1.5;margin-top:34px}
.s2 .pillars{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
.s2 .chip{font-size:22px;padding:12px 20px}
.s2 .quote{position:relative;padding:64px 60px 56px;border-radius:36px;background:linear-gradient(145deg,var(--navy) 0%,var(--blue) 100%);color:#fff;box-shadow:0 30px 60px rgba(11,45,79,.28)}
.s2 .quote .qm{position:absolute;top:-46px;left:48px;width:96px;height:96px;border-radius:50%;background:var(--cyan);display:grid;place-items:center;font-size:52px;color:#fff;animation:ripple 2.2s ease-out infinite}
.s2 .quote p{color:#fff;font-family:Montserrat,sans-serif;font-weight:700;font-size:46px;line-height:1.22;text-align:left}
.s2 .quote small{display:block;margin-top:26px;font-size:24px;color:#bfe2f7;font-weight:600;letter-spacing:.02em}
.merge{position:relative;height:210px;margin-top:40px}
.merge i{position:absolute;top:74px;width:62px;height:62px;border-radius:50%;display:block}
.merge i:nth-child(1){left:40px;background:var(--cyan);--mx:184px}.merge i:nth-child(2){left:150px;background:var(--aqua);--mx:74px}
.merge i:nth-child(3){left:260px;background:var(--blue);--mx:-36px}.merge i:nth-child(4){left:370px;background:var(--teal);--mx:-146px}
.slide.active .merge i{animation:merge 5s var(--ease) infinite 1.4s}
.merge b{position:absolute;left:180px;top:30px;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--cyan),var(--aqua),var(--blue),var(--navy),var(--cyan));opacity:0;box-shadow:0 18px 40px rgba(11,45,79,.3)}
.slide.active .merge b{animation:whole 5s var(--ease) infinite 1.4s}
@keyframes merge{0%,15%{transform:none;opacity:1}45%,70%{transform:translateX(var(--mx,0));opacity:0}90%,100%{transform:none;opacity:1}}
@keyframes whole{0%,30%{opacity:0;transform:scale(.5) rotate(0)}45%,72%{opacity:1;transform:scale(1) rotate(180deg)}88%,100%{opacity:0;transform:scale(.5) rotate(360deg)}}

/* ---------- Grupo/equipo ---------- */
.cmp{margin-top:34px;display:grid;grid-template-columns:230px 1fr 1fr;column-gap:28px;row-gap:14px}
.cmp .hd{font-family:Montserrat;font-weight:800;font-size:30px;letter-spacing:.14em;text-transform:uppercase;padding:18px 30px;border-radius:22px;display:flex;align-items:center;gap:16px}
.cmp .hd.g{background:#E3EAF1;color:#4d6074}
.cmp .hd.e{background:linear-gradient(90deg,var(--ocean),var(--aqua),var(--ocean));background-size:200% 100%;color:#fff}
.slide.active .cmp .hd.e.a{animation:down .85s var(--ease) both,shim 5s linear infinite;animation-delay:630ms,1.5s}
.cmp .lab{font-family:Montserrat;font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--ocean);display:flex;align-items:center}
.cmp .c{font-size:26px;line-height:1.3;padding:16px 28px;border-radius:18px;display:flex;align-items:center;min-height:84px}
.cmp .c.g{background:#fff;color:#4a5b6c;border:1px dashed #c3d0dc}
.cmp .c.e{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 8px 24px rgba(14,122,194,.12);border-left:6px solid var(--cyan)}

/* ---------- Por qué ---------- */
.ben{margin-top:46px;display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.ben .card{width:calc((100% - 72px)/4);padding:34px 30px;display:flex;flex-direction:column;gap:22px;min-height:250px}
.ben .card p{font-size:27px;line-height:1.32;color:var(--ink)}

/* ---------- Roles / niveles / flujos ---------- */
.org{position:absolute;inset:0}
.org > svg{position:absolute;inset:0;width:1920px;height:1080px;z-index:1}
.band{position:absolute;left:120px;right:120px;border-radius:26px}
.band .bl{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:270px}
.band .bl b{display:inline-flex;align-items:center;gap:10px;font-family:Montserrat;font-weight:800;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:8px 16px;border-radius:10px}
.band .bl span{display:block;margin-top:10px;font-size:21px;line-height:1.25;color:var(--muted);font-weight:600}
.b1{top:262px;height:112px;background:rgba(11,45,79,.07)}.b1 b{background:var(--navy)}
.b2{top:386px;height:252px;background:rgba(14,122,194,.07)}.b2 b{background:var(--ocean)}
.b3{top:650px;height:146px;background:rgba(51,182,194,.11)}.b3 b{background:var(--aqua)}
.node{position:absolute;width:262px;height:68px;margin:-34px 0 0 -131px;border-radius:999px;display:grid;place-items:center;font-family:Montserrat;font-weight:700;font-size:22px;background:#fff;color:var(--navy);box-shadow:0 10px 26px rgba(11,45,79,.12);border:2px solid #d6e6f2;z-index:2}
.node.top{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;border:none;font-size:24px}
.node.mid{background:linear-gradient(90deg,var(--ocean),var(--cyan));color:#fff;border:none}
.node.sup{background:var(--aqua);color:#fff;border:none;width:290px;margin-left:-145px}
.org .base path{stroke:#9cc6e3}
.flowdots{opacity:0;transition:opacity .6s}
.s5.st1:not(.st2) .fd-down,.s5.st3 .fd-down,.s5.st2 .fd-up{opacity:1}
.legend{position:absolute;left:0;right:0;top:818px;display:flex;justify-content:center;gap:26px}
.lgd{display:flex;align-items:center;gap:14px;padding:12px 26px;border-radius:999px;background:#fff;border:2px solid #dbe7f0;font-family:Montserrat;font-weight:700;font-size:22px;color:#93a4b4;transition:all .6s var(--ease)}
.lgd .arr{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;background:#c6d3de;transition:background .6s}
.s5.st1:not(.st2) .lg-down,.s5.st3 .lg-down{color:var(--navy);border-color:var(--cyan);box-shadow:0 10px 26px rgba(0,169,230,.22)}
.s5.st1:not(.st2) .lg-down .arr,.s5.st3 .lg-down .arr{background:var(--cyan);animation:arrdown 1.2s ease-in-out infinite}
.s5.st2 .lg-up{color:var(--navy);border-color:var(--amber);box-shadow:0 10px 26px rgba(242,163,58,.25)}
.s5.st2 .lg-up .arr{background:var(--amber);animation:arrup 1.2s ease-in-out infinite}
@keyframes arrdown{50%{transform:translateY(5px)}}@keyframes arrup{50%{transform:translateY(-5px)}}
.stephint{position:absolute;right:120px;top:830px;font-family:Montserrat;font-weight:600;font-size:17px;color:var(--muted);display:flex;gap:8px;align-items:center;transition:opacity .4s}
.s5.st3 .stephint{opacity:0}

/* ---------- descriptor ---------- */
.desc .side{position:absolute;left:120px;top:92px;width:420px;bottom:150px;display:flex;flex-direction:column}
.desc h2{font-size:60px}
.desc .eyebrow{letter-spacing:.14em;white-space:nowrap;font-size:19px}
.desc .pages{margin-top:auto}
.desc .pages .big{font-family:Montserrat;font-weight:900;font-size:120px;line-height:.9;color:var(--navy);letter-spacing:-.04em}
.desc .pages .big span{color:var(--cyan);margin:0 8px}
.desc .pages .lbl{font-family:Montserrat;font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.desc .prog{display:flex;gap:10px;margin-top:34px}
.desc .prog i{flex:1;height:10px;border-radius:5px;background:#d9e5ee}
.desc .prog i.on{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--cyan));background-size:200% 100%;animation:shim 2.5s linear infinite}
.hint{margin-top:30px;font-size:22px;color:var(--muted);display:flex;gap:12px;align-items:center}
.hint .ico{font-size:28px;color:var(--ocean)}
.desc .docs{position:absolute;right:96px;top:70px;display:flex;gap:38px}
.docw{animation:float 7s ease-in-out infinite}
.docw:nth-child(2){animation-delay:-3.5s}
.doc{width:610px;height:777px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(11,45,79,.22),0 4px 12px rgba(11,45,79,.08);cursor:zoom-in;position:relative}

.callbar{display:flex;align-items:center;gap:18px;padding:20px 28px;border-radius:20px;background:var(--navy);color:#fff;font-family:Montserrat;font-weight:700;font-size:24px;line-height:1.3}
.callbar .ico{font-size:34px;color:#7fd3f5;flex:none}
.ask{display:flex;align-items:center;gap:22px;padding:22px 30px;border-radius:22px;background:#fff7e8;border:2px solid #f6d9a3}
.ask .q{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--amber);color:#fff;font:900 36px Montserrat;animation:ripple-a 2.4s ease-out infinite}
@keyframes ripple-a{0%{box-shadow:0 0 0 0 rgba(242,163,58,.5)}100%{box-shadow:0 0 0 20px rgba(242,163,58,0)}}
.ask b{display:block;font:800 16px Montserrat;letter-spacing:.16em;text-transform:uppercase;color:#b9771c;margin-bottom:4px}
.ask p{font-size:27px;font-weight:600;color:#5a3d10;text-align:left;line-height:1.3}
/* sección */
.sec .pad{display:flex;flex-direction:column;justify-content:center}
.sec .bign{position:absolute;right:90px;top:50%;transform:translateY(-54%);font:900 560px/0.8 Montserrat;color:transparent;-webkit-text-stroke:3px rgba(127,211,245,.35);letter-spacing:-.04em}
.sec .bign span{display:inline-block;animation:float 7s ease-in-out infinite}
.sec h2{font-size:92px;line-height:1.02;font-weight:900;max-width:1180px;margin-top:26px}
.sec .chipx{align-self:flex-start;margin-top:34px;display:inline-flex;align-items:center;gap:12px;background:var(--cyan);color:var(--navy);font:900 30px Montserrat;padding:12px 28px;border-radius:999px}
/* portada */
.r1 h1{font-size:122px!important}
.r1 .amp{font-size:118px!important}
/* objetivos */
.objc{display:flex;gap:30px;align-items:flex-start;padding:40px 44px}
.objc .bn{font:900 72px/0.9 Montserrat;background:linear-gradient(135deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.objc p{font-size:31px;line-height:1.42}
.objc .iconbox{width:84px;height:84px;font-size:42px}
/* contenidos */
.agenda{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:54px}
.ag{position:relative;padding:40px 34px;min-height:560px;display:flex;flex-direction:column;overflow:hidden}
.ag .n{font:900 96px/0.85 Montserrat;color:#e3eef6}
.ag h3{font-size:27px;line-height:1.25;margin-top:auto}
.ag .iconbox{margin-top:24px}
.ag.hl{background:linear-gradient(160deg,var(--navy),var(--blue))}.ag.hl h3{color:#fff}.ag.hl .n{color:rgba(255,255,255,.12)}.ag.hl .iconbox{background:#fff;color:var(--blue)}
.ag .bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--cyan));background-size:200% 100%;animation:shim 4s linear infinite}
/* qué es */
.dlg{position:relative;height:300px;margin-top:10px}
.dlg .who{position:absolute;top:70px;width:150px;text-align:center;font:800 20px Montserrat;color:var(--navy)}
.dlg .who .av{width:120px;height:120px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:58px;color:#fff;animation:ripple 2.6s ease-out infinite}
.dlg .dbub{position:absolute;padding:14px 22px;border-radius:20px;font:700 20px Montserrat;color:#fff;white-space:nowrap}
.slide.active .dlg .dbub.q1{animation:bubA 4s ease-in-out infinite}
.slide.active .dlg .dbub.q2{animation:bubB 4s ease-in-out infinite}
@keyframes bubA{0%,8%{opacity:0;transform:translateY(10px)}15%,45%{opacity:1;transform:none}52%,100%{opacity:0}}
@keyframes bubB{0%,50%{opacity:0;transform:translateY(10px)}58%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill{display:flex;gap:16px;align-items:center;padding:18px 22px;border-radius:20px;background:#fff;box-shadow:0 10px 26px rgba(11,45,79,.07)}
.pill .iconbox{width:60px;height:60px;font-size:30px;border-radius:18px}
.pill span{font-size:24px;line-height:1.3;font-weight:600;color:var(--navy)}
/* pirámide normativa */
.npyr{position:absolute;left:130px;top:250px;width:880px;height:620px;overflow:visible}
.nlab{position:absolute;left:1020px;width:780px;display:flex;align-items:center;gap:16px}
.nlab b{font:800 23px Montserrat;color:var(--navy);display:block;line-height:1.2}
.nlab span{font-size:20px;color:var(--muted);display:block;line-height:1.25}
.nlab i{width:14px;height:14px;border-radius:50%;flex:none}
.climb{position:absolute;left:60px;top:300px;height:520px;width:40px}
/* ley 18.575 */
.lawq{position:relative;padding:44px 50px;border-radius:30px;background:linear-gradient(150deg,var(--navy),var(--blue));color:#fff;box-shadow:0 26px 60px rgba(11,45,79,.25)}
.lawq .tag{display:inline-block;font:800 16px Montserrat;letter-spacing:.16em;text-transform:uppercase;color:#7fd3f5;margin-bottom:14px}
.lawq p{color:#fff;font-family:Montserrat;font-weight:600;font-size:31px;line-height:1.38;text-align:left}
.lawq .mk{position:absolute;right:30px;top:-40px;width:84px;height:84px;border-radius:50%;background:var(--cyan);display:grid;place-items:center;font-size:44px;color:#fff;animation:ripple 2.4s ease-out infinite}
/* estatuto */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.stat{padding:22px 24px;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(11,45,79,.07)}
.stat b{display:block;font:900 54px/1 Montserrat;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:20px;color:var(--muted);margin-top:8px;line-height:1.25}
.reg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.reg .pill span{font-size:23px}
/* timeline artículos */
.arts{position:absolute;left:120px;right:120px;top:380px;height:420px}
.arts > svg{position:absolute;left:0;top:0;width:100%;height:120px;overflow:visible}
.art{position:absolute;top:0;width:420px;margin-left:-210px;text-align:center}
.art .badge{width:200px;margin:0 auto;padding:22px 0;border-radius:24px;background:linear-gradient(135deg,var(--ocean),var(--cyan));color:#fff;font:900 40px Montserrat;box-shadow:0 18px 40px rgba(14,122,194,.3);animation:ripple 2.8s ease-out infinite}
.art h3{margin-top:40px;font-size:30px;line-height:1.25}
/* artículo detalle */
.artside{position:absolute;left:120px;top:92px;bottom:150px;width:520px;display:flex;flex-direction:column}
.artside .badge{margin-top:34px;align-self:flex-start;padding:26px 40px;border-radius:30px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font:900 76px/1 Montserrat;box-shadow:0 24px 50px rgba(11,45,79,.28)}
.artside .lead{margin-top:34px;font-size:28px}
.artside .mini{margin-top:auto;display:flex;gap:12px;align-items:center}
.artside .mini span{padding:8px 16px;border-radius:999px;font:800 18px Montserrat;color:#93a4b4;background:#e6eef4}
.artside .mini span.on{background:var(--cyan);color:var(--navy)}
.artmain{position:absolute;left:720px;right:120px;top:92px;bottom:150px;display:flex;flex-direction:column;gap:24px;justify-content:center}
.cycle{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cycle span{padding:12px 20px;border-radius:14px;background:#e7f3fb;font:800 21px Montserrat;color:var(--navy)}
.cycle i{color:var(--ocean);font-size:26px;font-style:normal}
.slide.active .cycle span{animation:cyc 4s ease-in-out infinite}
.cycle span:nth-of-type(2){animation-delay:1s!important}.cycle span:nth-of-type(3){animation-delay:2s!important}.cycle span:nth-of-type(4){animation-delay:3s!important}
@keyframes cyc{0%,20%{background:var(--cyan);color:#fff}30%,100%{background:#e7f3fb;color:var(--navy)}}
/* ciclo anual */
.anual{position:absolute;left:120px;top:250px;width:1680px;height:640px;overflow:visible}
.srcnote{position:absolute;left:120px;top:900px;font-size:19px;color:var(--muted);font-style:italic}
/* secuencia */
.seq{position:absolute;left:120px;right:120px;top:270px;height:600px}
.seq > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.phz{position:absolute;top:0;height:520px;border-radius:28px}
.phz b{position:absolute;top:22px;left:0;right:0;text-align:center;font:800 19px Montserrat;letter-spacing:.16em;text-transform:uppercase}
.sn{position:absolute;top:200px;width:200px;margin-left:-100px;text-align:center}
.sn .c{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:46px;position:relative;animation:ripple 2.8s ease-out infinite}
.sn .c em{position:absolute;top:-8px;right:-6px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--navy);font:900 20px/40px Montserrat;font-style:normal;box-shadow:0 6px 14px rgba(11,45,79,.2)}
.sn b{display:block;font:800 22px Montserrat;color:var(--navy);line-height:1.2}
.loopnote{position:absolute;left:0;right:0;top:560px;text-align:center;font:700 19px Montserrat;color:var(--ocean)}
/* cabecera de paso */
.stephead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.stephead .phl{padding:10px 20px;border-radius:999px;font:800 18px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.sbar{display:flex;align-items:center;gap:0}
.sbar i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 15px Montserrat;font-style:normal;color:#93a4b4;background:#e6eef4}
.sbar s{width:22px;height:3px;background:#dbe6ee;text-decoration:none}
.sbar i.done{background:#bfe3f5;color:var(--navy)}
.sbar i.on{background:var(--cyan);color:#fff;box-shadow:0 0 0 6px rgba(0,169,230,.2);animation:ripple 2.2s ease-out infinite}
.stepnum{font:900 30px Montserrat;color:var(--cyan);margin-right:6px}
.formula{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.formula span{padding:16px 24px;border-radius:18px;font:800 24px Montserrat;color:#fff}
.formula i{font:900 34px Montserrat;font-style:normal;color:var(--navy)}
.slide.active .formula .res{animation:resglow 2.6s ease-in-out infinite}
@keyframes resglow{50%{box-shadow:0 0 0 10px rgba(0,169,230,.18)}}
.obs{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.obs div{display:flex;gap:12px;align-items:center;font-size:23px;line-height:1.25;color:var(--ink);padding:12px 16px;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(11,45,79,.05)}
.obs .ico{font-size:26px;color:var(--ocean);flex:none}
.quote{font-family:Montserrat;font-weight:700;font-size:30px;line-height:1.35;color:var(--navy);font-style:italic}
.form{background:#fff;border-radius:22px;box-shadow:0 18px 40px rgba(11,45,79,.12);overflow:hidden;border:1px solid #e1ebf2}
.form .fh{background:var(--navy);color:#fff;padding:16px 24px;font:800 20px Montserrat;letter-spacing:.06em;display:flex;justify-content:space-between}
.form .fr{display:grid;grid-template-columns:230px 1fr;border-top:1px solid #e6eef4}
.form .fr b{padding:16px 20px;background:#f3f8fb;font:800 19px Montserrat;color:var(--ocean)}
.form .fr span{padding:16px 20px;font-size:23px;line-height:1.3;color:var(--ink)}
.form .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:26px 24px 18px}
.form .sig div{border-top:2px dashed #b9cbd8;padding-top:8px;text-align:center;font:700 16px Montserrat;color:var(--muted)}
.pen{position:absolute;font-size:44px;color:var(--ocean)}
.slide.active .pen{animation:write 3s ease-in-out infinite}
@keyframes write{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(40px,4px) rotate(-6deg)}50%{transform:translate(80px,0) rotate(0)}75%{transform:translate(40px,-4px) rotate(6deg)}}
/* sándwich */
.sw{overflow:visible}
.sw .ly{transform-box:fill-box;transform-origin:center}
.slide.active .sw .ly{animation:drop .8s cubic-bezier(.3,1.5,.5,1) both}
.slide.active .sw .ly.l2{animation-delay:.9s}.slide.active .sw .ly.l3{animation-delay:1.1s}.slide.active .sw .ly.l4{animation-delay:1.3s}.slide.active .sw .ly.l5{animation-delay:1.5s}.slide.active .sw .ly.l1{animation-delay:.7s}
@keyframes drop{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
.slide.active .sw .bob{animation:float 5s ease-in-out infinite 2.2s}
.swlab{position:absolute;display:flex;align-items:center;gap:14px;font:900 30px Montserrat;letter-spacing:.06em;text-transform:uppercase}
.swlab::before{content:"";width:70px;height:4px;border-radius:2px;background:currentColor}
.ctx{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.ctx .card{padding:30px 30px;display:flex;flex-direction:column;gap:14px;min-height:230px}
.ctx h3{font-size:27px}
.ctx p{font-size:24px;line-height:1.35;text-align:left}
.layer{padding:26px 30px;border-radius:24px;position:relative}
.layer b{display:inline-block;font:900 20px Montserrat;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:10px;color:#fff;margin-bottom:12px}
.layer p{font-size:25px;line-height:1.38}
.exs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px}
.ex{display:flex;flex-direction:column;gap:10px}
.ex h3{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--ocean);margin-bottom:4px}
.ex .bread,.ex .fill{padding:18px 22px;font-size:22px;line-height:1.35;color:var(--ink)}
.ex .bread{background:#fbe7c3;border-radius:22px;border:2px solid #f0cf94}
.ex .bread:first-of-type{border-radius:40px 40px 14px 14px}
.ex .bread.bt{border-radius:14px 14px 34px 34px}
.ex .fill{background:#e6f4fb;border-radius:12px;border:2px solid #b9def2;font-weight:600}
.ex .lbl{font:900 14px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:#a36b14;display:block;margin-bottom:4px}
.ex .fill .lbl{color:var(--ocean)}
/* BEST */
.bestl{display:flex;gap:30px;justify-content:center;margin-top:20px}
.bt-tile{width:250px;height:250px;border-radius:40px;display:grid;place-items:center;font:900 170px/1 Montserrat;color:#fff;box-shadow:0 26px 50px rgba(11,45,79,.28);position:relative}
.slide.active .bt-tile{animation:tile 3.6s ease-in-out infinite}
.bt-tile:nth-child(2){animation-delay:.25s!important}.bt-tile:nth-child(3){animation-delay:.5s!important}.bt-tile:nth-child(4){animation-delay:.75s!important}
@keyframes tile{0%,60%,100%{transform:none}70%{transform:translateY(-22px)}80%{transform:none}}
.bt-w{display:flex;gap:30px;justify-content:center;margin-top:30px}
.bt-w div{width:250px;text-align:center}
.bt-w b{display:block;font:800 26px Montserrat;color:var(--navy)}
.bt-w span{display:block;font-size:21px;color:var(--muted);margin-top:4px}
.brow{display:grid;grid-template-columns:110px 380px 60px 1fr;align-items:center;gap:22px;padding:18px 26px;border-radius:24px;background:#fff;box-shadow:0 10px 28px rgba(11,45,79,.07)}
.brow .lt{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;font:900 60px/1 Montserrat;color:#fff}
.brow .nm b{display:block;font:900 26px Montserrat;color:var(--navy);letter-spacing:.04em}
.brow .nm span{display:block;font:700 19px Montserrat;color:var(--ocean);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.brow .ar{font-size:40px;color:var(--cyan)}
.brow .ds{font-size:24px;line-height:1.35;color:var(--ink)}
.brows{display:flex;flex-direction:column;gap:16px;margin-top:34px}
/* instrucciones */
.techs{display:flex;gap:16px;margin:22px 0 4px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.role{padding:28px 28px;text-align:left}
.role .iconbox{margin-bottom:16px}
.role h3{font-size:25px;letter-spacing:.1em;text-transform:uppercase}
.role p{font-size:22px;line-height:1.35;margin-top:8px;text-align:left}
.rot{position:absolute;right:130px;top:96px;width:150px;height:150px}
.slide.active .rot .spinr{animation:spin 9s linear infinite;transform-origin:75px 75px;transform-box:view-box}
/* gracias */
.contacts{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;margin-top:56px;text-align:left;width:1500px}
.ct{padding:30px 32px;border-radius:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.ct .hd{display:flex;align-items:center;gap:12px;font:800 18px Montserrat;letter-spacing:.14em;text-transform:uppercase;color:#7fd3f5;margin-bottom:14px}
.ct .hd .ico{font-size:26px}
.ct div.v{font-size:24px;line-height:1.5;color:#fff;user-select:all}
.ct div.v small{display:block;font-size:19px;color:#a9c6df;line-height:1.3;margin-bottom:8px}

/* ---------- presenter chrome ---------- */
#progress{position:fixed;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--cyan),var(--aqua));width:0;transition:width .6s var(--ease);z-index:20}
#hud{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:30;opacity:0;transition:opacity .4s}
body.mouse #hud{opacity:1}
#hud button{width:46px;height:46px;border-radius:12px;border:none;background:rgba(11,45,79,.82);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:22px}
#hud button:hover{background:var(--ocean)}
body.idle{cursor:none}
#black{position:fixed;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .4s}
#black.on{opacity:1;pointer-events:auto}
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,20,36,.9);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;cursor:zoom-out}
#lightbox.on{opacity:1;pointer-events:auto}
#lightbox img{max-height:94vh;max-width:94vw;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.94);transition:transform .45s var(--ease);background:#fff}
#lightbox.on img{transform:none}
#help{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:35;background:rgba(11,45,79,.92);color:#fff;font-family:Montserrat;font-weight:600;font-size:15px;padding:12px 20px;border-radius:14px;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
#help.on{opacity:1}
#help kbd{background:rgba(255,255,255,.16);border-radius:6px;padding:2px 8px;margin:0 3px;font-family:inherit}


aside.notes{display:none}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
html.still .slide .a{opacity:1!important}
html.still .draw path,html.still .draw line{stroke-dashoffset:0!important}
html.still .msg,html.still .flowdots,html.still .beam{display:none!important}
html.embed #hud,html.embed #help,html.embed #progress,html.embed #toast{display:none!important}
html.embed,html.embed body{cursor:default}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:60;max-width:min(680px,92vw);background:rgba(11,45,79,.95);color:#fff;font-family:Montserrat,sans-serif;font-weight:600;font-size:15px;line-height:1.4;padding:14px 22px;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- presenter view ---------- */
html.presenter,html.presenter body{background:#061a2e;overflow:hidden}
html.presenter #viewport,html.presenter #hud,html.presenter #help,html.presenter #progress,html.presenter #black,html.presenter #lightbox{display:none!important}
#pv{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding:16px 20px;color:#e6f0f8;font-family:'Source Sans 3',system-ui,sans-serif}
#pv header{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#pv .ttl{flex:1;min-width:0}
#pv .ttl small{display:block;font-family:Montserrat;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7fd3f5}
#pv .ttl b{display:block;font-family:Montserrat;font-weight:800;font-size:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pv .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:12px}
#pv .big{font-family:Montserrat;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:.02em}
#pv .lbl{font-family:Montserrat;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fb3cf}
#pv button{font-family:Montserrat;font-weight:700;font-size:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;cursor:pointer}
#pv button:hover{background:#0E7AC2}
#pv button:focus-visible,#pv select:focus-visible{outline:2px solid #00A9E6;outline-offset:2px}
#pv .col{display:flex;flex-direction:column;gap:10px;min-height:0}
#pv .frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0B2D4F;box-shadow:0 18px 40px rgba(0,0,0,.4)}
#pv .cur .frame{max-height:calc(100vh - 230px);width:auto;max-width:100%}
#pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#pv .frame .end{position:absolute;inset:0;display:none;place-items:center;font-family:Montserrat;font-weight:800;font-size:20px;color:#7fd3f5;background:#0B2D4F}
#pv .frame.isend .end{display:grid}
#pv .notes{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px}
#pv .notes .nh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#pv .notes .nb{flex:1;overflow:auto;padding:14px 18px;font-size:var(--nfs,22px);line-height:1.45;color:#f2f7fb}
#pv .notes .nb ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:.45em}
#pv .notes .nb b{color:#7fd3f5}
#pv footer{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#pv footer .nav{font-size:17px;padding:12px 22px}
#pv footer .nav.main{background:#0E7AC2;border-color:#0E7AC2}
#pv select{font:600 15px 'Source Sans 3',sans-serif;color:#fff;background:#0B2D4F;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:9px 12px;max-width:340px}
#pv .steps{display:flex;gap:6px;align-items:center}
#pv .steps i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
#pv .steps i.on{background:#00A9E6}
#pv .conn{margin-left:auto;font-size:14px;color:#8fb3cf;display:flex;align-items:center;gap:8px}
#pv .conn i{width:10px;height:10px;border-radius:50%;background:#e0a33a}
#pv .conn.ok i{background:#3ccf7b}
#pv .paused .big{color:#e0a33a}

/* ---------- barra de navegación, ir a número, clic lateral ---------- */
#progress{display:none!important}
#scrub{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:25;cursor:pointer;touch-action:none}
#scrub .tr{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(11,45,79,.28);transition:height .15s,background .15s}
#scrub:hover .tr,#scrub.drag .tr{height:16px;background:rgba(11,45,79,.78)}
#scrub .fl{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cyan),var(--aqua));transition:width .45s var(--ease)}
#scrub .tk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.5)}
#scrub .hv{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;display:none;box-shadow:0 0 8px rgba(0,0,0,.5)}
#scrub:hover .hv,#scrub.drag .hv{display:block}
#spv{position:fixed;z-index:36;width:332px;padding:6px;border-radius:14px;background:#0B2D4F;box-shadow:0 18px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s}
#spv.show{opacity:1}
#spv .fr{position:relative;width:320px;height:180px;border-radius:9px;overflow:hidden;background:var(--bg)}
#spv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#spv .lb{font:600 13px Montserrat,sans-serif;color:#fff;padding:7px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{bottom:44px!important;right:auto!important;left:50%;transform:translateX(-50%);align-items:center}
#hud .go{display:flex;align-items:center;gap:6px;height:46px;padding:0 10px;border-radius:12px;background:rgba(11,45,79,.82);color:#fff;font:700 15px Montserrat,sans-serif}
#gin{width:56px;height:34px;border-radius:9px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:800 18px Montserrat,sans-serif;text-align:center;outline:none;padding:0}
#gin:focus{border-color:var(--cyan);background:rgba(0,169,230,.22)}
#gin.bad{border-color:#F0592A}
body.gofocus #hud{opacity:1}
.edge{position:fixed;top:0;bottom:30px;width:110px;z-index:19;pointer-events:none;opacity:0;transition:opacity .25s;display:flex;align-items:center;justify-content:center;color:#fff}
.edge span{width:54px;height:54px;border-radius:50%;background:rgba(11,45,79,.55);display:grid;place-items:center;font-size:26px}
#edgeL{left:0;background:linear-gradient(90deg,rgba(11,45,79,.16),transparent)}
#edgeR{right:0;background:linear-gradient(270deg,rgba(11,45,79,.16),transparent)}
body.mouse.zl #edgeL,body.mouse.zr #edgeR{opacity:1}
#help{white-space:normal!important;max-width:min(980px,94vw);text-align:left;line-height:1.9}
#help b{color:#7fd3f5;font-weight:700}
html.embed #scrub,html.embed #spv,html.embed .edge,html.presenter #scrub,html.presenter #spv,html.presenter .edge{display:none!important}
html.print #scrub,html.print #spv,html.print .edge{display:none!important}
/* ---------- print / PDF ---------- */
@page{size:1920px 1080px;margin:0}
html.print,html.print body{overflow:visible;height:auto;background:#fff}
html.print #viewport{position:static}
html.print #deck{position:static;transform:none!important;width:1920px;height:auto;overflow:visible}
html.print #bg,html.print #bgdark,html.print #orbs{display:none}
html.print .slide{position:relative;opacity:1;visibility:visible;width:1920px;height:1080px;break-after:page;page-break-after:always;transition:none;background:var(--bg)}
html.print .slide.dark{background:var(--darkbg)}
html.print .slide:last-of-type{break-after:auto;page-break-after:auto}
html.print *,html.print *::before,html.print *::after{animation:none!important;transition:none!important}
html.print .slide .a{opacity:1!important}
html.print .draw path,html.print .draw line{stroke-dashoffset:0!important}
html.print .msg,html.print .flowdots,html.print .beam,html.print .stephint,html.print .hint,html.print #hud,html.print #progress,html.print #help,html.print .qrc::after,html.print .browser .shot::after,html.print .step .col::after,html.print .mx .q::after,html.print .flowline,html.print .pyshine,html.print .browser .bar .addr::after,html.print .obj .target .rp{display:none!important}
html.print .merge b{opacity:0}
html.print .porb{position:absolute;pointer-events:none}
{{ESTILOS_EXTRA}}
</style>
</head>
<body>
<div id="viewport"><div id="deck">
<div id="bg"></div><div id="bgdark"></div><div id="orbs"></div>
{{DIAPOSITIVAS}}
</div></div>

<div id="progress"></div>
<div id="scrub" title="Pasa el mouse para ver las diapositivas; haz clic o arrastra para ir a una"><div class="tr"><i class="fl"></i></div></div>
<div id="spv" aria-hidden="true"><div class="fr"></div><div class="lb"></div></div>
<div class="edge" id="edgeL" aria-hidden="true"><span>‹</span></div>
<div class="edge" id="edgeR" aria-hidden="true"><span>›</span></div>
<div id="hud">
  <button id="bPrev" title="Anterior (←)"><span class="ico" style="transform:rotate(180deg)">{{icon:arrow-right}}</span></button>
  <label class="go" title="Escribe el número de diapositiva y presiona Enter"><input id="gin" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Ir a la diapositiva número"><span id="gof">/ 0</span></label>
  <button id="bNext" title="Siguiente (→)"><span class="ico">{{icon:arrow-right}}</span></button>
  <button id="bHelp" title="Ver atajos de teclado (H)"><span class="ico">{{icon:keyboard}}</span></button>
  <button id="bPres" title="Vista del presentador (S)"><span class="ico">{{icon:presentation}}</span></button>
  <button id="bFull" title="Pantalla completa (F)"><span class="ico">{{icon:maximize}}</span></button>
</div>
<div id="help"><b>Avanzar:</b> <kbd>→</kbd> <kbd>Espacio</kbd> o clic en la mitad derecha · <b>Retroceder:</b> <kbd>←</kbd> o clic en la mitad izquierda · <b>Ir a una diapositiva:</b> escribe su número (<kbd>0</kbd>–<kbd>9</kbd>) y <kbd>Enter</kbd>, o usa la barra inferior · <kbd>F</kbd> pantalla completa · <kbd>B</kbd> pantalla negra · <kbd>S</kbd> vista del presentador · <kbd>H</kbd> mostrar u ocultar esta ayuda</div>
<div id="black"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lightbox"><img alt=""></div>

<script>
(function(){
  const LOGOS='{{logos}}';
  const palette=['#00A9E6','#33B6C2','#0E6E92','#2462AC','#0E7AC2','#5fd0ff','#0B2D4F'];
  const deck=document.getElementById('deck');
  const slides=[...document.querySelectorAll('.slide')];
  const total=slides.length;
  const Q=new URLSearchParams(location.search);
  const PRINT=Q.has('print');
  const MODE=Q.has('presenter')?'presenter':(Q.has('embed')?'embed':'main');
  if(PRINT) document.documentElement.classList.add('print');
  if(MODE==='embed') document.documentElement.classList.add('embed');
  if(Q.has('still')) document.documentElement.classList.add('still');
  const CH='{{CANAL}}';
  const BASE=location.href.split('#')[0].split('?')[0];
  const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
  let bc=null; if(MODE!=='embed'){try{bc=new BroadcastChannel(CH)}catch(e){bc=null}}
  const toastEl=document.getElementById('toast');let tt;
  function toast(msg,ms){if(!toastEl)return;toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),ms||6000);}

  if(MODE==='presenter'){ presenter(); return; }

  function presenter(){
    document.documentElement.classList.add('presenter');
    document.title='Presentador · {{NOMBRE}}';
    const info=slides.map(s=>({title:s.dataset.title||'',steps:+(s.dataset.steps||0),notes:(s.querySelector('aside.notes')||{}).innerHTML||'<p>Sin notas para esta diapositiva.</p>'}));
    const pv=document.createElement('div');pv.id='pv';
    pv.innerHTML='<header><div class="ttl"><small>Vista del presentador · {{NOMBRE}}</small><b id="pvTitle">—</b></div>'+
      '<div class="box"><div><div class="lbl">Diapositiva</div><div class="big" id="pvCount">–</div></div></div>'+
      '<div class="box" id="pvTimerBox"><div><div class="lbl">Tiempo</div><div class="big" id="pvTimer">00:00</div></div><button id="pvPause" title="Pausar o reanudar (T)">Pausar</button><button id="pvReset" title="Reiniciar cronómetro">Reiniciar</button></div>'+
      '<div class="box"><div><div class="lbl">Hora</div><div class="big" id="pvClock">--:--</div></div></div></header>'+
      '<div class="col cur"><div class="lbl">Ahora en pantalla</div><div class="frame" id="fCur"><iframe title="Diapositiva actual" src="'+BASE+'?embed"></iframe></div></div>'+
      '<div class="col"><div class="lbl">A continuación</div><div class="frame" id="fNext"><iframe title="Siguiente" src="'+BASE+'?embed&still"></iframe><div class="end">Fin de la presentación</div></div>'+
      '<div class="notes"><div class="nh"><span class="lbl">Notas del presentador</span><span><button id="nMinus" title="Reducir letra">A−</button> <button id="nPlus" title="Aumentar letra">A+</button></span></div><div class="nb" id="pvNotes"></div></div></div>'+
      '<footer><button class="nav" id="pvPrev">← Anterior</button><button class="nav main" id="pvNext">Siguiente →</button>'+
      '<div class="steps" id="pvSteps"></div><select id="pvGo" aria-label="Ir a diapositiva"></select>'+
      '<div class="conn" id="pvConn"><i></i><span>Buscando la presentación…</span></div></footer>';
    document.body.appendChild(pv);
    const $=id=>document.getElementById(id);
    const sel=$('pvGo');info.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' · '+s.title;sel.appendChild(o);});
    let fs=22;try{fs=+localStorage.getItem('pvfs')||22}catch(e){}
    const setFs=v=>{fs=Math.max(14,Math.min(40,v));$('pvNotes').style.setProperty('--nfs',fs+'px');try{localStorage.setItem('pvfs',fs)}catch(e){}};setFs(fs);
    $('nMinus').onclick=()=>setFs(fs-2);$('nPlus').onclick=()=>setFs(fs+2);
    // timer
    let t0=Date.now(),acc=0,run=true;
    const fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0');};
    const el=()=>acc+(run?Date.now()-t0:0);
    const togglePause=()=>{if(run){acc=el();run=false;}else{t0=Date.now();run=true;}$('pvPause').textContent=run?'Pausar':'Reanudar';$('pvTimerBox').classList.toggle('paused',!run);};
    $('pvPause').onclick=togglePause;$('pvReset').onclick=()=>{acc=0;t0=Date.now();};
    setInterval(()=>{$('pvTimer').textContent=fmt(el());const d=new Date();$('pvClock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},500);
    // messaging
    const send=cmd=>{const m={type:'cmd',cmd:cmd.cmd,n:cmd.n,id:uid()};try{if(window.opener&&!window.opener.closed)window.opener.postMessage(m,'*')}catch(e){}try{bc&&bc.postMessage(m)}catch(e){}};
    let st={cur:0,step:0},last=0;
    const fCur=$('fCur').querySelector('iframe'),fNext=$('fNext').querySelector('iframe');
    const post=(f,c,s)=>{try{f.contentWindow.postMessage({type:'show',cur:c,step:s},'*')}catch(e){}};
    function render(){
      const c=st.cur,s=st.step,inf=info[c];
      $('pvTitle').textContent=inf.title;$('pvCount').textContent=(c+1)+' / '+info.length;
      $('pvNotes').innerHTML=inf.notes;$('pvNotes').scrollTop=0;sel.value=c;
      $('pvSteps').innerHTML=inf.steps?'<span class="lbl">Paso</span>'+Array.from({length:inf.steps+1},(_,k)=>'<i class="'+(k<=s?'on':'')+'"></i>').join(''):'';
      post(fCur,c,s);
      let nc=c,ns=s+1;if(s>=inf.steps){nc=c+1;ns=0;}
      const end=nc>=info.length;$('fNext').classList.toggle('isend',end);
      if(!end)post(fNext,nc,ns);
    }
    function onMsg(m){if(!m||m.type!=='state')return;st={cur:m.cur,step:m.step};last=Date.now();render();}
    addEventListener('message',e=>onMsg(e.data));if(bc)bc.onmessage=e=>onMsg(e.data);
    fCur.addEventListener('load',()=>post(fCur,st.cur,st.step));fNext.addEventListener('load',render);
    setInterval(()=>{const ok=Date.now()-last<6000;const c=$('pvConn');c.classList.toggle('ok',ok);c.querySelector('span').textContent=ok?'Sincronizado con la presentación':'Sin conexión: abre la presentación y presiona S';if(!ok)send({cmd:'hello'});},2000);
    send({cmd:'hello'});
    $('pvPrev').onclick=()=>send({cmd:'prev'});$('pvNext').onclick=()=>send({cmd:'next'});
    sel.onchange=()=>send({cmd:'go',n:+sel.value});
    addEventListener('keydown',e=>{
      if(e.altKey||e.ctrlKey||e.metaKey||e.target===sel)return;const k=e.key;
      if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n','N'].includes(k)){e.preventDefault();send({cmd:'next'});}
      else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p','P'].includes(k)){e.preventDefault();send({cmd:'prev'});}
      else if(k==='Home'){send({cmd:'go',n:0})}else if(k==='End'){send({cmd:'go',n:info.length-1})}
      else if(k==='b'||k==='B'||k==='.'){send({cmd:'black'})}
      else if(k==='t'||k==='T'){togglePause()}
      else if(k==='f'||k==='F'){const d=document;if(!d.fullscreenElement)d.documentElement.requestFullscreen().catch(()=>{});else d.exitFullscreen();}
    });
    render();
  }

  document.querySelectorAll('svg.ring').forEach(svg=>{
    const n=+svg.dataset.ring, R=+svg.dataset.r, d=+svg.dataset.dot, op=svg.dataset.op||1;
    const W=parseFloat(svg.style.width), c=W/2; svg.setAttribute('viewBox','0 0 '+W+' '+W);
    let h='<g opacity="'+op+'"><circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="'+(svg.closest('.dark')?'rgba(255,255,255,.35)':'#9cc6e3')+'" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>';
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2-Math.PI/2;const r=d*(k%2?0.78:1);
      h+='<circle cx="'+(c+R*Math.cos(a)).toFixed(1)+'" cy="'+(c+R*Math.sin(a)).toFixed(1)+'" r="'+r+'" fill="'+palette[k%palette.length]+'"/>';}
    svg.innerHTML=h+'</g>'; svg.style.transformOrigin='50% 50%';
  });

  const OS=[170,70,120,54,150,84,104];
  function orbPos(i,j){
    const a=j*(Math.PI*2/OS.length)+i*0.83+(j%2?0.4:-0.25);
    const f=1+0.1*(((i*7+j*3)%5)/4);
    return {x:960+1010*f*Math.cos(a), y:540+600*f*Math.sin(a), s:OS[j]};
  }
  function makeFoot(i){
    const f=document.createElement('div');f.className='foot';
    f.innerHTML='<div class="meta"><span class="pg">'+String(i+1).padStart(2,'0')+' / '+total+'</span><span>{{PIE}} · Desarrollo Organizacional</span></div>'+LOGOS;
    return f;
  }
  if(PRINT){
    slides.forEach((s,i)=>{
      s.appendChild(makeFoot(i));
      const dark=s.classList.contains('dark');
      let svg='<svg class="porb" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0;overflow:hidden">';
      OS.forEach((_,j)=>{const p=orbPos(i,j);svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(p.s/2)+'" fill="'+palette[j%palette.length]+'" opacity="'+(dark?.22:.16)+'"/>';});
      s.insertAdjacentHTML('afterbegin',svg+'</svg>');
      if(s.dataset.steps){for(let k=1;k<=+s.dataset.steps;k++)s.classList.add('st'+k);}
    });
    return;
  }

  const orbWrap=document.getElementById('orbs');
  const orbs=OS.map((_,j)=>{const o=document.createElement('div');o.className='orb';o.style.color=palette[j%palette.length];o.innerHTML='<i></i>';orbWrap.appendChild(o);return o;});
  function placeOrbs(i){const dark=slides[i].classList.contains('dark');
    orbs.forEach((o,j)=>{const p=orbPos(i,j);o.style.transform='translate('+(p.x-50)+'px,'+(p.y-50)+'px) scale('+(p.s/100)+')';o.style.opacity=dark?.24:.17;});}
  const foot=makeFoot(0);deck.appendChild(foot);const pg=foot.querySelector('.pg');

  const prog=document.getElementById('progress');
  function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform='translate(-50%,-50%) scale('+s+')';}
  addEventListener('resize',fit);fit();

  let cur=-1, step=0; const timers=new Map(); let syncNav=null;
  let pres=null; const seen=new Set();
  function notify(){if(MODE!=='main')return;const m={type:'state',cur:cur,step:step,total:total};try{if(pres&&!pres.closed)pres.postMessage(m,'*')}catch(e){}try{bc&&bc.postMessage(m)}catch(e){}}
  function setStep(n){const s=slides[cur];step=n;const max=+(s.dataset.steps||0);for(let k=1;k<=max;k++)s.classList.toggle('st'+k,k<=n);notify();}
  function go(n,fromBack){
    n=Math.max(0,Math.min(total-1,n)); if(n===cur) return;
    const fwd=n>cur;
    if(cur>=0){const o=slides[cur];o.classList.remove('active');o.classList.add('leaving');o.classList.toggle('back',!fwd);
      clearTimeout(timers.get(o));timers.set(o,setTimeout(()=>{o.classList.remove('leaving','back');},800));}
    const s=slides[n]; clearTimeout(timers.get(s)); s.classList.remove('leaving','back');
    s.querySelectorAll('.a,.draw path').forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation='';});
    s.classList.add('active'); cur=n;
    setStep(fromBack?+(s.dataset.steps||0):0);
    deck.classList.toggle('is-dark',s.classList.contains('dark'));
    placeOrbs(n);
    pg.textContent=String(n+1).padStart(2,'0')+' / '+total;
    prog.style.width=((n+1)/total*100)+'%';syncNav&&syncNav(n);
    if(MODE==='main')history.replaceState(null,'','#'+(n+1));
  }
  function show(n,s){n=Math.max(0,Math.min(total-1,n));if(n!==cur)go(n,false);const max=+(slides[cur].dataset.steps||0);setStep(Math.max(0,Math.min(max,s||0)));}
  function next(){const max=+(slides[cur].dataset.steps||0);if(step<max){setStep(step+1);return;}go(cur+1);}
  function prev(){if(step>0){setStep(step-1);return;}go(cur-1,true);}

  if(MODE==='embed'){
    addEventListener('message',e=>{const m=e.data;if(m&&m.type==='show')show(m.cur,m.step);});
    go(0);return;
  }

  const lb=document.getElementById('lightbox'), lbi=lb.querySelector('img'), black=document.getElementById('black');
  const closeLB=()=>{if(lb.classList.contains('on')){lb.classList.remove('on');return true}return false};
  function fs(){const d=document,el=d.documentElement;if(!d.fullscreenElement){const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{});}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d)}}

  // presenter link
  function handleCmd(m){
    if(!m||m.type!=='cmd'||seen.has(m.id))return;seen.add(m.id);
    if(m.cmd==='next')next();else if(m.cmd==='prev')prev();else if(m.cmd==='go')go(m.n,false);
    else if(m.cmd==='black')black.classList.toggle('on');
    notify();
  }
  addEventListener('message',e=>{if(e.data&&e.data.type==='cmd'){if(!pres&&e.source&&e.source!==window)pres=e.source;handleCmd(e.data);}});
  if(bc)bc.onmessage=e=>handleCmd(e.data);
  async function openPresenter(){
    let feat='popup=yes,width=1280,height=800';let ext=null;
    try{if('getScreenDetails' in window){const d=await window.getScreenDetails();const curS=d.currentScreen;ext=d.screens.find(s=>s!==curS)||null;feat+=',left='+(curS.availLeft+40)+',top='+(curS.availTop+40);}}catch(e){}
    if(ext){try{await document.documentElement.requestFullscreen({screen:ext});}catch(e){ext=null;}}
    pres=window.open(BASE+'?presenter','do-presentador',feat);
    if(!pres){toast('El navegador bloqueó la ventana del presentador. Permite las ventanas emergentes para esta página y presiona S de nuevo.',9000);return;}
    setTimeout(notify,800);setTimeout(notify,2000);
    toast(ext?'Presentación en la pantalla extendida y vista del presentador abierta.':'Vista del presentador abierta. Lleva esta ventana a la pantalla del proyector y presiona F.',8000);
  }

  addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey) return;
    const k=e.key;
    if(document.activeElement===gin){if(k==='Enter'){e.preventDefault();gCommit();}else if(k==='Escape'){e.preventDefault();gin.blur();}return;}
    if(k==='Enter'&&Date.now()-lastGo<1500){e.preventDefault();return;}
    if(closeLB() && k!=='f' && k!=='F'){e.preventDefault();return;}
    if(black.classList.contains('on') && !['b','B','.'].includes(k)){black.classList.remove('on');e.preventDefault();return;}
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n','N'].includes(k)){e.preventDefault();next();}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p','P'].includes(k)){e.preventDefault();prev();}
    else if(k==='Home'){go(0)} else if(k==='End'){go(total-1)}
    else if(k==='f'||k==='F'||k==='F5'){e.preventDefault();fs();}
    else if(k==='s'||k==='S'){e.preventDefault();openPresenter();}
    else if(k==='h'||k==='H'||k==='?'){toggleHelp();}
    else if(/^[0-9]$/.test(k)){e.preventDefault();toggleHelp(false);gin.focus();gin.value=k;gUpd();}
    else if(k==='g'||k==='G'){e.preventDefault();gin.focus();}
    else if(k==='b'||k==='B'||k==='.'){black.classList.toggle('on')}
    else if(k==='Escape'){black.classList.remove('on')}
  });
  document.addEventListener('click',e=>{
    if(e.target.closest('#hud,#scrub,#spv')) return;
    if(closeLB()) return;
    if(black.classList.contains('on')){black.classList.remove('on');return;}
    const z=e.target.closest('.zoomable,.doc');
    if(z){lbi.src=z.dataset.src||z.querySelector('img').src;lb.classList.add('on');return;}
    if(e.clientX<innerWidth/2)prev();else next();
  });
  document.addEventListener('contextmenu',e=>{e.preventDefault();if(!closeLB())prev();});
  let wl=0;addEventListener('wheel',e=>{const t=Date.now();if(t-wl<700||Math.abs(e.deltaY)<20)return;wl=t;e.deltaY>0?next():prev();},{passive:true});
  let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?next():prev();}tx=null;});
  document.getElementById('bNext').onclick=e=>{e.stopPropagation();next()};
  document.getElementById('bPrev').onclick=e=>{e.stopPropagation();prev()};
  document.getElementById('bFull').onclick=e=>{e.stopPropagation();fs()};
  document.getElementById('bHelp').onclick=e=>{e.stopPropagation();toggleHelp()};
  document.getElementById('bPres').onclick=e=>{e.stopPropagation();openPresenter()};
  let idle;addEventListener('mousemove',e=>{const B=document.body;B.classList.add('mouse');B.classList.remove('idle');
    const overUI=e.target.closest&&e.target.closest('#hud,#scrub,#spv,#help');const side=e.clientX<innerWidth/2;
    B.classList.toggle('zl',!overUI&&side);B.classList.toggle('zr',!overUI&&!side);
    clearTimeout(idle);idle=setTimeout(()=>{if(document.activeElement===gin)return;B.classList.remove('mouse','zl','zr');B.classList.add('idle')},2200)});
  addEventListener('mouseleave',()=>document.body.classList.remove('zl','zr'));

  // ---- barra de navegación con vista previa e ir a número ----
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const stepsOf=i=>+(slides[i].dataset.steps||0);
  function makePv(box){let f=null,ready=false,want=null;
    const send=()=>{if(ready&&want!==null){try{f.contentWindow.postMessage({type:'show',cur:want,step:stepsOf(want)},'*')}catch(_){}}};
    return n=>{want=n;if(!f){f=document.createElement('iframe');f.src=BASE+'?embed&still';f.tabIndex=-1;f.setAttribute('aria-hidden','true');
      f.addEventListener('load',()=>{ready=true;setTimeout(send,60);});box.appendChild(f);}else send();};}
  const sc=document.getElementById('scrub'),spv=document.getElementById('spv'),pvSet=makePv(spv.querySelector('.fr'));
  const trk=sc.querySelector('.tr'),fill=sc.querySelector('.fl'),hv=document.createElement('i');hv.className='hv';
  for(let i=1;i<total;i++){const k=document.createElement('i');k.className='tk';k.style.left=(i/total*100)+'%';trk.appendChild(k);}
  trk.appendChild(hv);
  const idxAt=x=>clamp(Math.floor(x/Math.max(1,sc.clientWidth)*total),0,total-1);
  const label=n=>(n+1)+' / '+total+' · '+(slides[n].dataset.title||'');
  function pvAt(x){const n=idxAt(x);spv.classList.add('show');spv.style.bottom='40px';spv.style.left=clamp(x-166,8,innerWidth-340)+'px';
    hv.style.left=((n+.5)/total*100)+'%';spv.querySelector('.lb').textContent=label(n);pvSet(n);return n;}
  let drag=false;
  sc.addEventListener('pointermove',e=>{const n=pvAt(e.clientX);if(drag&&n!==cur)go(n,false);});
  sc.addEventListener('pointerleave',()=>{if(!drag)spv.classList.remove('show')});
  sc.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();drag=true;sc.classList.add('drag');try{sc.setPointerCapture(e.pointerId)}catch(_){}
    const n=pvAt(e.clientX);if(n!==cur)go(n,false);});
  const endDrag=e=>{if(!drag)return;drag=false;sc.classList.remove('drag');if(e&&e.clientY<innerHeight-34)spv.classList.remove('show');};
  sc.addEventListener('pointerup',endDrag);sc.addEventListener('pointercancel',endDrag);
  const gin=document.getElementById('gin');document.getElementById('gof').textContent='/ '+total;
  let gTimer=null,lastGo=0;
  const gVal=()=>{const n=parseInt(gin.value,10);return(n>=1&&n<=total)?n:0};
  function gPv(n){const r=gin.getBoundingClientRect();spv.classList.add('show');spv.style.left=clamp(r.left+r.width/2-166,8,innerWidth-340)+'px';spv.style.bottom=(innerHeight-r.top+14)+'px';
    spv.querySelector('.lb').textContent=label(n-1);pvSet(n-1);}
  function gUpd(){clearTimeout(gTimer);const n=gVal();gin.classList.toggle('bad',!n&&gin.value!=='');
    if(n){gPv(n);gTimer=setTimeout(gCommit,n*10>total?600:2200);}else spv.classList.remove('show');}
  function gCommit(){const n=gVal();if(n){lastGo=Date.now();clearTimeout(gTimer);spv.classList.remove('show');gin.blur();go(n-1,false);}else gin.classList.add('bad');}
  gin.addEventListener('focus',()=>{try{gin.select()}catch(_){}document.body.classList.add('mouse','gofocus');});
  gin.addEventListener('blur',()=>{clearTimeout(gTimer);spv.classList.remove('show');gin.classList.remove('bad');gin.value=cur+1;document.body.classList.remove('gofocus');});
  gin.addEventListener('input',()=>{gin.value=gin.value.replace(/\D/g,'').slice(0,3);gUpd();});
  gin.addEventListener('click',e=>e.stopPropagation());
  syncNav=n=>{fill.style.width=((n+1)/total*100)+'%';if(document.activeElement!==gin)gin.value=n+1;};
  addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(!isNaN(n)&&n-1!==cur)go(n-1,false);});
  const help=document.getElementById('help');let ht;
  function toggleHelp(force){const on=force!==undefined?force:!help.classList.contains('on');help.classList.toggle('on',on);clearTimeout(ht);}
  setTimeout(()=>help.classList.add('on'),600);ht=setTimeout(()=>help.classList.remove('on'),6200);
  const h=parseInt(location.hash.slice(1));go(isNaN(h)?0:h-1);
})();
</script>
</body>
</html>
